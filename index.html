<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas 🌻✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 235, 150, 0.85);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.35);
            pointer-events: none;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="instruction">✨ Arrastra o desliza con el dedo para girar la galaxia 3D 🌻</div>

    <!-- Librerías de 3D necesarias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // =======================================================
        // 1. AQUÍ PUEDES EDITAR O AGREGAR MÁS FRASES PERSONALIZADAS:
        // =======================================================
        const mensajesPersonalizados = [
            "Feliz Día de las Flores Amarillas 🌻",
            "¡Para Ti, Fabii! 💛",
            "Contigo todo lugar es bonito ✨",
            "Gracias por ser mi sol de siempre",
            "Tu sonrisa ilumina mis días 🌟",
            "Un girasol para quien ilumina todo",
            "Contigo hasta lo simple brilla",
            "Miras lo bueno, como el girasol",
            "Pétalos dorados solo para ti",
            "Aquí siempre tienes un lugar",
            "Gracias por quedarte siempre",
            "21 de septiembre, contigo siempre 💛",
            "Que esta flor te alcance hoy",
            "Esta flor guarda un abrazo para ti",
            "El amarillo también dice te quiero",
            "Tu cariño no pasa de moda",
            "Contigo las tardes se hacen cortas",
            "El campo entero te manda saludos",
            "Quiero que sepas cuánto importas ✨"
        ];

        // --- 2. CONFIGURACIÓN DEL UNIVERSO 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 34);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.autoRotate = true; // Rotación automática continua
        controls.autoRotateSpeed = 0.8;

        // --- 3. AGUJERO NEGRO Y ANILLO DORADO CENTRAL ---
        const blackHoleGroup = new THREE.Group();

        // Esfera negra central
        const sphereGeo = new THREE.SphereGeometry(3.5, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const blackHole = new THREE.Mesh(sphereGeo, sphereMat);
        blackHoleGroup.add(blackHole);

        // Anillo de Acreción brillante
        const ringGeo = new THREE.RingGeometry(3.6, 8.0, 64);
        const ringMat = new THREE.MeshBasicMaterial({ 
            color: 0xffb700, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.95 
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        blackHoleGroup.add(ring);

        // Halo exterior
        const haloGeo = new THREE.RingGeometry(8.0, 10.5, 64);
        const haloMat = new THREE.MeshBasicMaterial({ 
            color: 0xff5500, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.45 
        });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        halo.rotation.x = Math.PI / 2;
        blackHoleGroup.add(halo);

        scene.add(blackHoleGroup);

        // --- 4. TEXTURAS DE TEXTO Y GIRASOLES ---
        function createMessageSprite(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'Bold 26px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(13, 3.2, 1);
            return sprite;
        }

        function createSunflowerSprite() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 128;

            ctx.font = '80px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ffa500';
            ctx.shadowBlur = 12;
            ctx.fillText('🌻', 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(2.4, 2.4, 1);
            return sprite;
        }

        // --- 5. DISTRIBUIR MENSAJES EN ESPIRAL EN ALREDEDOR DEL CENTRO ---
        const galaxyGroup = new THREE.Group();
        const numItems = 95;

        for (let i = 0; i < numItems; i++) {
            const itemGroup = new THREE.Group();

            const radius = 9 + (i * 0.38) + (Math.random() * 2);
            const angle = i * 0.38;
            const yOffset = (Math.random() - 0.5) * 3.5;

            itemGroup.position.x = Math.cos(angle) * radius;
            itemGroup.position.z = Math.sin(angle) * radius;
            itemGroup.position.y = yOffset;

            const msgText = mensajesPersonalizados[i % mensajesPersonalizados.length];
            const msgSprite = createMessageSprite(msgText);
            itemGroup.add(msgSprite);

            const flower = createSunflowerSprite();
            flower.position.set(-7.0, 0, 0);
            itemGroup.add(flower);

            galaxyGroup.add(itemGroup);
        }

        scene.add(galaxyGroup);

        // --- 6. FONDO DE ESTRELLAS DORADAS ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1800;
        const starPos = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 160;
            starPos[i + 1] = (Math.random() - 0.5) * 160;
            starPos[i + 2] = (Math.random() - 0.5) * 160;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffd700, size: 0.5, transparent: true, opacity: 0.85 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- 7. ANIMACIÓN EN TIEMPO REAL ---
        function animate() {
            requestAnimationFrame(animate);

            blackHoleGroup.rotation.y += 0.006;
            galaxyGroup.rotation.y += 0.002;
            starField.rotation.y += 0.0004;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
